name: Gerar Jogo J2ME (.jar para Nokia X2-01)

on:
  push:
    paths-ignore:
      - 'KongRun.jar'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-j2me:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Instalar Java 8 Oficial
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Baixar bibliotecas J2ME (CLDC 1.1 / MIDP 2.0 / MMAPI)
        run: |
          wget -q https://repo1.maven.org/maven2/org/microemu/microemu-cldc/2.0.4/microemu-cldc-2.0.4.jar -O cldc.jar
          wget -q https://repo1.maven.org/maven2/org/microemu/microemu-midp/2.0.4/microemu-midp-2.0.4.jar -O midp.jar
          wget -q https://repo1.maven.org/maven2/org/microemu/microemu-jsr-135/2.0.4/microemu-jsr-135-2.0.4.jar -O mmapi.jar
          wget -q https://repo1.maven.org/maven2/net/sf/proguard/proguard-base/6.2.2/proguard-base.jar -O proguard.jar || wget -q https://repo1.maven.org/maven2/net/sf/proguard/proguard-base/6.2.2/proguard-base-6.2.2.jar -O proguard.jar

      - name: Compilar, Preverificar (S40) e Gerar KongRun.jar
        run: |
          mkdir -p build
          javac -source 1.3 -target 1.1 -bootclasspath cldc.jar:midp.jar:mmapi.jar -d build KongRunMIDlet.java
          printf "Manifest-Version: 1.0\nMIDlet-Name: Kong Run\nMIDlet-Version: 1.0.0\nMIDlet-Vendor: TiagoGames\nMIDlet-1: Kong Run, , KongRunMIDlet\nMicroEdition-Profile: MIDP-2.0\nMicroEdition-Configuration: CLDC-1.1\n" > MANIFEST.MF
          jar cvfm raw.jar MANIFEST.MF -C build .
          java -jar proguard.jar -injars raw.jar -outjars KongRun.jar -libraryjars cldc.jar:midp.jar:mmapi.jar -microedition -dontshrink -dontoptimize -dontobfuscate -keep "public class KongRunMIDlet"

      - name: Salvar KongRun.jar direto na página inicial do seu GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add KongRun.jar
          git commit -m "Jogo KongRun.jar compilado e pronto para baixar" || echo "Sem alteracoes"
          git push

      - name: Disponibilizar nos Artifacts também
        uses: actions/upload-artifact@v4
        with:
          name: KongRun-Nokia-X2-01-JAR
          path: KongRun.jar
